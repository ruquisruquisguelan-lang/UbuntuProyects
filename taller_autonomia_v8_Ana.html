<!doctype html>
<html lang="es" data-piel="alumno">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Taller de autonomía</title>
<style>
  :root{
    --bg:#faf7f2; --surface:#fff; --panel:#f3efe8; --ink:#241f1a; --soft:#574f45; --faint:#7a7065;
    --line:rgba(60,40,20,.13); --line-soft:rgba(60,40,20,.08);
    --accent:#c0562a; --accent-soft:rgba(192,86,42,.1); --accent-ink:#fff;
    --auto:#1f7a6b; --auto-soft:rgba(31,122,107,.13);
    --comm:#6a4a9c; --comm-soft:rgba(106,74,156,.12);
    --good:#1f7a3d; --good-bg:rgba(31,122,61,.12); --warn:#9a6611; --warn-bg:rgba(183,121,31,.13);
    --fs:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    --serif:"Fraunces","Iowan Old Style",Georgia,serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#15120f; --surface:#211c17; --panel:#272017; --ink:#f3ede4; --soft:#cbc1b4; --faint:#9c9284;
    --line:rgba(255,255,255,.13); --line-soft:rgba(255,255,255,.07);
    --accent:#e8824f; --accent-soft:rgba(232,130,79,.16); --accent-ink:#1a120c;
    --auto:#3fb89f; --auto-soft:rgba(63,184,159,.18);
    --comm:#b79ae6; --comm-soft:rgba(183,154,230,.16);
    --good:#5fcf7f; --good-bg:rgba(63,184,95,.16); --warn:#e0a53f; --warn-bg:rgba(224,165,63,.16);
    color-scheme:dark;
  }}
  :root[data-theme="dark"]{
    --bg:#15120f; --surface:#211c17; --panel:#272017; --ink:#f3ede4; --soft:#cbc1b4; --faint:#9c9284;
    --line:rgba(255,255,255,.13); --line-soft:rgba(255,255,255,.07);
    --accent:#e8824f; --accent-soft:rgba(232,130,79,.16); --accent-ink:#1a120c;
    --auto:#3fb89f; --auto-soft:rgba(63,184,159,.18);
    --comm:#b79ae6; --comm-soft:rgba(183,154,230,.16);
    --good:#5fcf7f; --good-bg:rgba(63,184,95,.16); --warn:#e0a53f; --warn-bg:rgba(224,165,63,.16);
    color-scheme:dark;
  }
  *{box-sizing:border-box} html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font:19px/1.65 var(--fs);-webkit-font-smoothing:antialiased;
    padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));padding-block:0}
  .wrap{max-width:640px;margin:0 auto;padding-block:22px 80px}
  .hidden{display:none!important}

  .top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
  .brand{font:700 14px var(--fs);letter-spacing:.02em;color:var(--accent);display:flex;align-items:center;gap:9px;cursor:pointer}
  .brand .dot{width:10px;height:10px;border-radius:3px;background:var(--accent);transform:rotate(45deg)}
  .tgl{margin-left:auto;background:var(--surface);border:1px solid var(--line);color:var(--soft);
    width:42px;height:42px;border-radius:12px;font-size:18px;cursor:pointer;display:grid;place-items:center}
  .tgl:hover{border-color:var(--accent)}

  h1{font:600 clamp(28px,6vw,40px)/1.1 var(--serif);letter-spacing:-.01em;margin:10px 0 14px;text-wrap:balance}
  h2{font:600 23px var(--serif);letter-spacing:-.01em;margin:0 0 8px}
  .lede{font-size:20px;color:var(--soft);margin:0 0 22px;text-wrap:pretty}
  p{margin:0 0 14px}

  .voice{font:500 20px/1.5 var(--serif);color:var(--ink);background:var(--accent-soft);
    border-left:3px solid var(--accent);border-radius:4px 14px 14px 4px;padding:16px 20px;margin:0 0 20px;text-wrap:pretty}
  .voice .who{display:block;font:700 11px var(--fs);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
  .voice.comm{background:var(--comm-soft);border-color:var(--comm)} .voice.comm .who{color:var(--comm)}

  .chips{display:flex;flex-wrap:wrap;gap:9px;margin:0 0 26px}
  .chip{display:inline-flex;align-items:center;gap:7px;font:600 13.5px var(--fs);color:var(--soft);
    background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:8px 14px}
  .chip svg{width:15px;height:15px;stroke:var(--auto);fill:none;stroke-width:2.2}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;margin:0 0 16px}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;width:100%;
    background:var(--accent);color:var(--accent-ink);border:none;border-radius:14px;
    font:700 19px var(--fs);padding:17px 22px;min-height:58px;cursor:pointer;transition:transform .08s,filter .15s}
  .btn:hover{filter:brightness(1.06)} .btn:active{transform:scale(.985)}
  .btn.ghost{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--accent);filter:none}
  .btn.comm{background:var(--comm)}
  .btn.sm{width:auto;font-size:16px;padding:12px 18px;min-height:48px}
  .btn[disabled]{opacity:.4;cursor:not-allowed}
  .btnrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
  .btnrow .btn{width:auto;flex:1;min-width:150px}

  /* capa cards on home */
  .capa{display:flex;align-items:flex-start;gap:16px;width:100%;text-align:left;cursor:pointer;
    background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:20px;margin-bottom:12px;transition:border-color .15s,transform .08s}
  .capa:hover:not([disabled]){transform:translateY(-1px)}
  .capa.c1:hover{border-color:var(--accent)} .capa.c3:hover{border-color:var(--comm)}
  .capa .n{flex:none;width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font:700 17px var(--fs)}
  .capa.c1 .n{background:var(--accent-soft);color:var(--accent)} .capa.c3 .n{background:var(--comm-soft);color:var(--comm)}
  .capa .tx{flex:1;min-width:0}
  .capa .tt{display:block;font:700 18px var(--fs);margin-bottom:3px}
  .capa .ds{display:block;font-size:15.5px;color:var(--faint);line-height:1.45}
  .capa .ar{flex:none;align-self:center;color:var(--faint);font-size:22px}

  .task{display:flex;align-items:center;gap:16px;width:100%;text-align:left;cursor:pointer;
    background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;margin-bottom:12px;transition:border-color .15s,transform .08s}
  .task:hover:not([disabled]){border-color:var(--accent);transform:translateY(-1px)}
  .task.cm:hover:not([disabled]){border-color:var(--comm)}
  .task[disabled]{opacity:.55;cursor:default}
  .task .ic{flex:none;width:48px;height:48px;border-radius:13px;display:grid;place-items:center;background:var(--accent-soft);font-size:24px}
  .task.cm .ic{background:var(--comm-soft)}
  .task .tx{flex:1;min-width:0}
  .task .tt{display:block;font:700 18px var(--fs);margin-bottom:2px}
  .task .ds{display:block;font-size:15px;color:var(--faint)}
  .task .st{flex:none;font:700 11px var(--fs);letter-spacing:.06em;text-transform:uppercase;color:var(--auto);background:var(--auto-soft);border-radius:999px;padding:5px 11px}
  .task .why{display:block;font-size:14px;color:var(--faint);margin-top:4px}
  .capa.c2 .n{background:var(--auto-soft);color:var(--auto)}
  .capa.c2:hover{border-color:var(--auto)}
  .voice.path{background:var(--auto-soft);border-color:var(--auto)} .voice.path .who{color:var(--auto)}
  .btn.path{background:var(--auto)}
  .step-tag.path{color:var(--auto)}
  .task.pth:hover:not([disabled]){border-color:var(--auto)}
  .task.pth .ic{background:var(--auto-soft)}
  .seal.path{background:var(--auto-soft);border-color:var(--auto)} .seal.path svg{stroke:var(--auto)}
  .badge.path{color:var(--auto);background:var(--auto-soft);border-color:var(--auto)} .badge.path svg{stroke:var(--auto)}
  .appcat{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin-bottom:10px}
  .appcat .ac{font:700 15px var(--fs);color:var(--auto);margin-bottom:2px}
  .appcat .ap{font-size:15px;color:var(--soft)} .appcat .ae{font-size:14.5px;color:var(--ink);margin-top:4px} .appcat .an{font-size:13.5px;color:var(--faint);margin-top:3px;font-style:italic}

  .meters{display:grid;gap:14px;background:var(--panel);border:1px solid var(--line-soft);border-radius:16px;padding:18px 20px;margin:0 0 22px}
  .meter .ml{display:flex;justify-content:space-between;align-items:baseline;font:600 14px var(--fs);margin-bottom:7px}
  .meter .ml .v{font:700 14px var(--fs)}
  .track{height:11px;border-radius:999px;background:var(--line-soft);overflow:hidden}
  .fill{height:100%;border-radius:999px;transition:width .7s cubic-bezier(.22,1,.36,1)}
  .meter.apoyo .fill{background:var(--accent)} .meter.apoyo .v{color:var(--accent)}
  .meter.auto .fill{background:var(--auto)} .meter.auto .v{color:var(--auto)}
  .meter .hint{font-size:13px;color:var(--faint);margin-top:6px}

  .step-tag{font:700 12px var(--fs);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
  .step-tag.comm{color:var(--comm)}

  label.fld{display:block;font:600 15px var(--fs);color:var(--soft);margin:16px 0 7px}
  input[type=text],input[type=number],textarea{width:100%;background:var(--bg);border:1.5px solid var(--line);border-radius:12px;
    color:var(--ink);font:400 18px/1.55 var(--fs);padding:14px 16px;resize:vertical}
  input:focus,textarea:focus{outline:none;border-color:var(--accent)}
  textarea{min-height:120px}
  .micro{font-size:14.5px;color:var(--faint);margin:8px 0 0;display:flex;gap:8px}
  .micro svg{flex:none;width:17px;height:17px;stroke:var(--auto);fill:none;stroke-width:2;margin-top:2px}

  .anat{background:var(--panel);border:1px dashed var(--line);border-radius:14px;padding:16px 18px;margin:4px 0 6px}
  .anat .exlab{font:700 11px var(--fs);letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:10px}
  .anat .part{margin-bottom:11px} .anat .part:last-child{margin-bottom:0}
  .anat .pn{font:700 12px var(--fs);letter-spacing:.04em;text-transform:uppercase;color:var(--accent);display:block;margin-bottom:1px}
  .anat .pv{font-size:16px;color:var(--soft);font-style:italic}

  .checklist{list-style:none;padding:0;margin:6px 0 0}
  .checklist li{position:relative;padding-left:30px;margin-bottom:9px;font-size:16.5px;color:var(--soft)}
  .checklist li::before{content:"";position:absolute;left:0;top:3px;width:19px;height:19px;border-radius:6px;border:2px solid var(--accent)}

  .preview{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:16px 18px;white-space:pre-wrap;font-size:16.5px;line-height:1.6;color:var(--ink);margin:8px 0 2px}
  .crit{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--line-soft)}
  .crit:first-child{border-top:none}
  .crit .k{flex:none;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:15px;font-weight:700}
  .crit.ok .k{background:var(--good-bg);color:var(--good)} .crit.no .k{background:var(--warn-bg);color:var(--warn)}
  .crit .ct{font-size:16px} .crit .ct b{display:block;font-weight:700;margin-bottom:1px}
  .crit .ct .cm{color:var(--faint);font-size:14.5px}

  .anti{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:6px}
  .anti .ba{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0}
  .anti .ba>div{flex:1;min-width:150px;border-radius:12px;padding:13px 15px;font-size:15px}
  .anti .bad{background:var(--warn-bg);color:var(--warn)} .anti .gud{background:var(--auto-soft);color:var(--auto)}
  .anti .ba b{display:block;font:700 12px var(--fs);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}

  /* grid (hoja de cálculo) */
  table.grid{width:100%;border-collapse:collapse;margin:6px 0 4px;font-size:16px}
  table.grid th{font:700 12px var(--fs);letter-spacing:.03em;text-transform:uppercase;color:var(--faint);text-align:center;padding:6px 4px}
  table.grid th:first-child{text-align:left}
  table.grid td{padding:5px 4px;text-align:center;border-top:1px solid var(--line-soft)}
  table.grid td:first-child{text-align:left;font-weight:600}
  table.grid input{width:58px;padding:9px 6px;text-align:center;font-size:17px}
  table.grid .media{font:700 17px var(--fs);color:var(--auto)}
  .formula{background:var(--auto-soft);color:var(--auto);border-radius:10px;padding:12px 15px;font-size:16px;margin:12px 0 2px}
  .pickrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
  .pickrow button{flex:1;min-width:90px;background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px;font:600 16px var(--fs);color:var(--ink);cursor:pointer}
  .pickrow button.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}

  /* community: observar columns + 8R */
  .obs{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:4px 0 2px}
  @media(max-width:460px){.obs{grid-template-columns:1fr}}
  .obscol{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px}
  .obscol h3{margin:0 0 4px;font:700 13px var(--fs);letter-spacing:.04em;text-transform:uppercase}
  .obscol.have h3{color:var(--auto)} .obscol.need h3{color:var(--accent)}
  .obscol .sub{font-size:13px;color:var(--faint);margin-bottom:10px}
  .bag{display:flex;flex-wrap:wrap;gap:7px;min-height:10px;margin-bottom:10px}
  .tag{display:inline-flex;align-items:center;gap:6px;font:600 14px var(--fs);border-radius:999px;padding:7px 12px;cursor:default}
  .obscol.have .tag{background:var(--auto-soft);color:var(--auto)} .obscol.need .tag{background:var(--accent-soft);color:var(--accent)}
  .tag b{cursor:pointer;opacity:.6;font-weight:700}
  .seeds{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 8px}
  .seed{font:600 13px var(--fs);background:var(--surface);border:1px dashed var(--line);border-radius:999px;padding:6px 11px;color:var(--soft);cursor:pointer}
  .seed:hover{border-color:var(--accent);color:var(--accent)}
  .addrow{display:flex;gap:8px} .addrow input{flex:1} .addrow button{flex:none;width:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--accent);font:700 22px var(--fs);cursor:pointer}
  .pillar{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .pillar .plab{font:700 16px var(--fs);margin-bottom:11px} .pillar .plab span{font-weight:500;color:var(--faint);font-size:13.5px}

  .rchips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 2px}
  .rchip{font:600 14px var(--fs);border-radius:999px;padding:8px 14px;cursor:pointer;border:1.5px solid var(--line);background:var(--surface);color:var(--faint)}
  .rchip.on{background:var(--comm-soft);color:var(--comm);border-color:var(--comm)}

  .grad{text-align:center;padding:10px 0}
  .seal{width:92px;height:92px;margin:0 auto 18px;border-radius:50%;display:grid;place-items:center;background:var(--auto-soft);border:2px solid var(--auto)}
  .seal.comm{background:var(--comm-soft);border-color:var(--comm)}
  .seal svg{width:46px;height:46px;stroke:var(--auto);fill:none;stroke-width:2.4} .seal.comm svg{stroke:var(--comm)}
  .badge{display:inline-flex;align-items:center;gap:9px;font:700 15px var(--fs);color:var(--auto);background:var(--auto-soft);border:1px solid var(--auto);border-radius:999px;padding:9px 18px;margin:4px 0 18px}
  .badge svg{width:17px;height:17px;stroke:var(--auto);fill:none;stroke-width:2.6;flex:none}
  .badge.comm{color:var(--comm);background:var(--comm-soft);border-color:var(--comm)} .badge.comm svg{stroke:var(--comm)}
  .punch{font:600 23px/1.4 var(--serif);text-wrap:balance;margin:18px 0} .punch .em{color:var(--accent)}
  .earned{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;margin:14px 0}
  .earned .e{font:600 13px var(--fs);color:var(--auto);background:var(--auto-soft);border-radius:999px;padding:7px 14px}
  .earned .e svg{width:14px;height:14px;stroke:var(--auto);fill:none;stroke-width:2.6;vertical-align:-2px;margin-right:3px}

  .foot{font-size:14px;color:var(--faint);text-align:center;margin-top:30px;line-height:1.5}
  .note{font-size:15px;color:var(--faint);background:var(--panel);border-radius:12px;padding:13px 16px;margin:14px 0 0}
  .note svg{width:16px;height:16px;stroke:var(--auto);fill:none;stroke-width:2;flex:none;vertical-align:-3px;margin-right:4px}
  .copied{color:var(--good);font-weight:600}

  /* territorio (capa institucional) + nuevas pantallas */
  .capa.terr:hover{border-color:var(--warn)}
  .capa.terr .n{background:var(--warn-bg);color:var(--warn)}
  .statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:6px 0 4px}
  @media(max-width:460px){.statgrid{grid-template-columns:1fr 1fr}}
  .stat{background:var(--panel);border:1px solid var(--line-soft);border-radius:14px;padding:16px 16px}
  .stat .sv{font:600 30px var(--serif);color:var(--comm);line-height:1.05}
  .stat .sl{font-size:13.5px;color:var(--faint);margin-top:5px;line-height:1.35}
  .skillbars{display:grid;gap:12px;margin:6px 0 2px}
  .skillbar .sbl{display:flex;justify-content:space-between;font:600 14px var(--fs);margin-bottom:6px}
  .skillbar .sbl .sv{color:var(--comm);font-weight:700}
  .skillbar .track .fill{background:var(--comm)}
  .lock{background:var(--panel);border:1px dashed var(--comm);border-radius:14px;padding:20px 18px;text-align:center;margin:4px 0}
  .lock .lk{width:52px;height:52px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;background:var(--comm-soft)}
  .lock .lk svg{width:26px;height:26px;stroke:var(--comm);fill:none;stroke-width:2.2}
  .lock .ln{font:600 20px var(--serif);color:var(--ink);margin-bottom:6px}
  .bowl{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
  .bowl .drop{width:16px;height:16px;border-radius:50%;background:var(--warn-bg);border:1.5px solid var(--warn)}
  .bowl .drop.off{background:transparent;border-style:dashed;border-color:var(--line)}
  .gov-svg{width:100%;max-width:400px;height:auto;display:block;margin:8px auto 14px}
  .compro{display:flex;gap:13px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line-soft)}
  .compro:first-of-type{border-top:none}
  .compro .ck{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--auto-soft)}
  .compro .ck svg{width:17px;height:17px;stroke:var(--auto);fill:none;stroke-width:2.4}
  .compro .ct{font-size:16.5px} .compro .ct b{display:block;margin-bottom:1px}
  .compro .ct .hw{color:var(--faint);font-size:14.5px;line-height:1.4}
  .redline{background:var(--warn-bg);border-radius:14px;padding:16px 18px;margin:8px 0 0;font-size:15.5px;color:var(--ink)}
  .redline b{color:var(--warn)}

  /* --- pantallas nuevas: adaptador cultural + cuenco --- */
  .capa.c2 .n,.capa.c3 .n{}
  .cflag{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px;background:var(--panel)}
  .cfh{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:5px}
  .cfrag{font-style:italic;background:var(--accent-soft);color:var(--ink);padding:1px 7px;border-radius:6px}
  .cdim{font:700 11px var(--fs);letter-spacing:.04em;text-transform:uppercase;padding:3px 9px;border-radius:999px;white-space:nowrap}
  .d-cog{background:var(--auto-soft);color:var(--auto)}
  .d-afe{background:var(--accent-soft);color:var(--accent)}
  .d-pro{background:var(--comm-soft);color:var(--comm)}
  .d-cri{background:var(--warn-bg);color:var(--warn)}
  .d-ide{background:var(--comm-soft);color:var(--comm)}
  .cbar{font-size:13.5px;color:var(--faint);margin:2px 0 4px}
  .gitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:15px}
  .gitem:first-child{border-top:none}
  .gpill{font:600 11px var(--fs);padding:3px 9px;border-radius:999px;background:var(--panel);color:var(--faint)}
  .gx{border:none;background:none;color:var(--faint);font:600 13px var(--fs);cursor:pointer;padding:4px}
  .gx:hover{color:var(--accent)}

  /* guarda un archivo: usa la capacidad downloads del visor si existe; si no (app offline), descarga por blob */
  function saveFile(filename, text){
    function blobDL(){ try{ var b=new Blob([text],{type:'application/json'}); var a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); }catch(e){} }
    try{
      if(window.claude && typeof window.claude.use==='function'){
        Promise.resolve(window.claude.use('downloads')).then(function(dl){
          if(dl && typeof dl.save==='function'){ dl.save({filename:filename,data:text}).catch(function(){}); }
          else { blobDL(); }
        }).catch(blobDL);
      } else { blobDL(); }
    }catch(e){ blobDL(); }
  }

  /* ============ generic TEXT task engine ============ */
  var W;
  function runText(def){ W={def:def, choice:null, parts:{}, round:0, gaveUp:false}; if(def.setup) tSetup(); else tRound(0); }
  function ctx(){ return {choice:W.choice, parts:W.parts, DEST:DEST}; }
  function rz(v){ return typeof v==='function'?v(ctx()):v; }

  function tSetup(){
    var s=W.def.setup;
    app.innerHTML='';
    var opts=s.opts.map(function(o){ return '<button class="task" data-o="'+o.k+'"><span class="ic">'+(o.ic||'•')+'</span><span class="tx"><span class="tt">'+esc(o.label)+'</span>'+(o.ds?'<span class="ds">'+esc(o.ds)+'</span>':'')+'</span></button>'; }).join('');

      '<div class="step-tag">'+esc(W.def.pre)+' · preparación</div><h2>'+esc(s.prompt)+'</h2>'+
      (s.sub?'<p style="color:var(--soft);margin-bottom:16px">'+esc(s.sub)+'</p>':'')+opts+
      '<div class="btnrow"><button class="btn ghost sm" id="bk">← Otras tareas</button></div>', 0, 6)));
    document.getElementById('bk').onclick=tasks;
    Array.prototype.forEach.call(app.querySelectorAll('.task[data-o]'),function(b){ b.onclick=function(){ W.choice=b.getAttribute('data-o'); W.round=0; tRound(0); }; });
  }

  function tRound(i){
    W.round=i; var r=W.def.rounds[i], auto=Math.min(95, i*28+(W.choice?8:(W.def.setup?0:8)));
    var f=r.field;
    var fieldHtml = f.kind==='text'
      ? '<input type="text" id="fin" placeholder="'+esc(f.ph||'')+'">'
      : '<textarea id="fin" placeholder="'+esc(f.ph||'')+'"></textarea>';
    app.innerHTML='';
    app.appendChild(el(shell(
      '<div class="step-tag">'+esc(r.tag)+'</div>'+
      '<div class="voice"><span class="who">El taller</span>'+rz(r.voice)+'</div>'+
      (r.blocks?rz(r.blocks):'')+

      {ok:Math.abs((parseFloat(H.luis)||-9)-meds[1])<0.06,b:'Media de Luis correcta',m:'La calculaste tú.'},
      {ok:Math.abs((parseFloat(H.marta)||-9)-meds[2])<0.06,b:'Media de Marta correcta',m:'Dos de tres, sin ayuda.'},
      {ok:H.lowest===lowName,b:'Lees la hoja, no solo la rellenas',m:'Identificas a quién apoyar.'}
    ];

    app.innerHTML='';
    app.appendChild(el(shell(
      '<div class="step-tag">Revisión</div>'+
      '<div class="voice"><span class="who">Primero tú</span>Una hoja no sirve de nada si no la sabes <b>leer</b>. Lo importante no es la media: es ver a quién hay que echar una mano.</div>'+
      '<div class="preview">'+esc(full)+'</div>'+
      '<div class="card" style="margin-top:16px"><div class="step-tag">Ahora lo reviso yo</div>'+
        checks.map(function(c){return '<div class="crit '+(c.ok?'ok':'no')+'"><span class="k">'+(c.ok?gi('check'):'!')+'</span><span class="ct"><b>'+esc(c.b)+'</b><span class="cm">'+esc(c.m)+'</span></span></div>';}).join('')+'</div>'+

      2, 92)));
    document.getElementById('bk').onclick=function(){ hGrid(2); };
    if(document.getElementById('bk2')) document.getElementById('bk2').onclick=function(){ hGrid(2); };
    if(document.getElementById('done')) document.getElementById('done').onclick=function(){ graduate('hoja', full, 'No te he hecho la hoja.<br>Ahora sabes <span class="em">leerla</span>.', 'Autónoma en: hoja de cálculo', false); };

  /* ============ EL CUENCO DE PROYECTOS · capa 3 (la tarta que crece desde abajo) ============ */
  var CTIPOS={coop:'Cooperativa',circ:'Circuito corto',prod:'Producto local',serv:'Servicio',otro:'Otro'};
  function cuencoAgg(ps){
    var personas=0,ingreso=0,localW=0;
    ps.forEach(function(p){ personas+=(+p.personas||0); ingreso+=(+p.ingreso||0); localW+=((+p.ingreso||0)*(+p.local||0)); });
    var localPct = ingreso>0 ? Math.round(localW/ingreso) : 0;
    return {personas:personas, ingreso:ingreso, localPct:localPct};
  }
  function cuencoList(){
    var box=document.getElementById('clist'); if(!box) return;

      '<div style="flex:1;min-width:0"><div class="ac">'+esc(p.nombre||CTIPOS[p.tipo])+' <span style="font-weight:500;color:var(--faint);font-size:13px">· '+CTIPOS[p.tipo]+'</span></div>'+
      '<div class="ap">'+(+p.personas||0)+' personas · '+(+p.ingreso||0).toLocaleString('es-MX')+' pesos/mes · '+(+p.local||0)+'% se queda en la comunidad</div></div>'+
      '<button class="gx" data-i="'+i+'" style="flex:none">quitar</button></div>'; }).join('');

      nodo('Mide <b>conducta, no autoinforme</b>: cuenta lo que escribes, no una carita ni una nota. Quien clasifica cada operación es el <b>nodo</b>; aquí ves el criterio, no un juicio de valor sobre ti.')+
      '<div class="card"><div class="step-tag">El ítem</div><p style="margin:2px 0 0"><b>Afirmación:</b> “Regar la milpa cada día es mejor que regarla a fondo dos veces por semana.” — trabaja sobre por qué suele ser <i>falsa</i> en tierra de temporal.</p></div>'+
      '<div class="crit" id="critwrap">'+ops.map(function(o){return '<div class="critrow" data-k="'+o[0]+'"><div class="ch">'+gi(o[1])+' '+o[2]+'</div><div class="cq">'+o[3]+'</div><textarea data-k="'+o[0]+'" placeholder="Escribe aquí…"></textarea></div>';}).join('')+'</div>'+
      '<div id="critout"></div>'+
      '<div class="dua">'+
        '<div class="duacard acc">'+gi('contar')+'<b>Apoyo de acceso</b><small>Audio, texto fácil y glosa. Es un <b>derecho</b>: no se retira nunca.</small></div>'+
        '<div class="duacard proc">'+gi('mano')+'<b>Apoyo de procesamiento</b><small>La pista al error. Es <b>temporal</b>: se desvanece al demostrar, y vuelve sin castigo si el error reaparece.</small></div>'+
      '</div>'+
      '<div class="note">Crosswalk a 5 dimensiones interculturales (González Plasencia / Tejeda): cognitiva, afectiva, procedimental, <b>crítica</b> ◆ y de identidad. La constancia es un <b>perfil verificable</b> (hash), no una nota.</div>'+
      backRow()+
    '</div>'));
    function render(){
      var rows=app.querySelectorAll('.critrow'); var n=0;
      Array.prototype.forEach.call(rows,function(r){ var t=r.querySelector('textarea'); var on=words(t.value)>=4; r.setAttribute('data-on',on?'1':'0'); if(on) n++; });
      var estado = n>=3?'demostrado':(n===2?'ejecutado':(n===1?'reproducido':'ilusorio'));
      var defs={
        demostrado:['Demostrado','≥3 de 4 operaciones: comprensión profunda. El apoyo de procesamiento puede retirarse.'],
        ejecutado:['Ejecutado','Resuelve, pero aún no lo explica ni lo transfiere. Sostener el andamio un paso más.'],
        reproducido:['Reproducido','Repite lo correcto sin reconstruirlo. Falta elaboración.'],
        ilusorio:['Ilusorio','La sensación de haber entendido sin conducta que lo muestre. Vamos a verlo juntos — sin prisa, sin castigo.']
      };
      var order=['ilusorio','reproducido','ejecutado','demostrado'];
      var lad=order.map(function(k){ var d=defs[k]; return '<div class="lstep '+k+'" data-cur="'+(k===estado?'1':'0')+'"><b>'+d[0]+'</b><span class="lb">'+d[1]+'</span></div>'; }).join('');
      document.getElementById('critout').innerHTML='<div class="card"><div class="step-tag">Σ operaciones observables: '+n+' / 4</div><div class="ladder">'+lad+'</div></div>';
    }
    Array.prototype.forEach.call(app.querySelectorAll('.critrow textarea'),function(t){ t.addEventListener('input',render); });
    wireBack(); render();
  }

  /* -------- Capa 3 · PENSAR y HACER (indagación + funciones ejecutivas) -------- */
  function cognicion(){
    setPiel('alumno');
    app.innerHTML='';
    app.appendChild(el('<div>'+
      '<div class="step-tag">Capa 3 · Pensar y hacer</div>'+
      '<h1>¿A qué nivel preguntas? ¿Cómo organizas?</h1>'+
      '<p class="lede">La tercera capa mira dos conductas: el <b>nivel de tus preguntas</b> (indagación) y cómo <b>descompones una tarea</b> (funciones ejecutivas).</p>'+
      nodo('El nivel de la pregunta lo clasifica el <b>nodo</b> (Bloom/Costa). Las funciones ejecutivas se observan en el plan que construyes — planificación, memoria de trabajo, flexibilidad (marco BRIEF-2 / Diamond). <b>No se etiqueta a la persona.</b>')+
      '<div class="card"><div class="step-tag">Indagación · preguntar mejor es pensar mejor</div>'+
        '<p style="margin:2px 0 8px">Escribe una pregunta sobre <b>por qué se pierde el suelo cuando llueve fuerte en la ladera</b>.</p>'+
        '<textarea id="qin" style="width:100%;min-height:58px;font:16px/1.5 var(--fs);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:9px"></textarea>'+
        '<div class="bloom" id="bloom"></div>'+
        '<div class="btnrow"><button class="btn" id="qgo">¿A qué nivel pregunto?</button></div></div>'+
      '<div class="card"><div class="step-tag">Funciones ejecutivas · descompone una tarea real</div>'+
        '<p style="margin:2px 0 8px">Tarea: <b>organizar la entrega de pedidos del sábado</b>. Añade los pasos, en orden.</p>'+
        '<div style="display:flex;gap:8px"><input id="stin" placeholder="Un paso…" style="flex:1;min-height:44px;font:16px var(--fs);background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:0 11px"><button class="btn sm" id="stadd">Añadir</button></div>'+
        '<div class="steps" id="steps"></div>'+
        '<div class="anota" id="feout" style="color:var(--faint);font-size:14px;margin-top:6px"></div></div>'+
      backRow()+
    '</div>'));
    var LV=[['recordar',['que ','quien','cuando','donde','lista','define','cuantos']],
            ['comprender',['explica','significa','resume','con tus palabras','describe']],
            ['aplicar',['como','usa','aplica','resuelve','calcula','ejemplo','pasos']],
            ['analizar',['compara','diferencia','relaciona','causa','porque','por que','estructura','descompon']],
            ['evaluar',['evalua','juzga','critica','mejor','peor','deberia','justifica','conviene']],
            ['crear',['disena','propon','inventa','crea','imagina','construye','como podriamos']]];
    var labels={recordar:'Recordar',comprender:'Comprender',aplicar:'Aplicar',analizar:'Analizar',evaluar:'Evaluar',crear:'Crear'};
    function bloomPaint(cur){ document.getElementById('bloom').innerHTML=['recordar','comprender','aplicar','analizar','evaluar','crear'].map(function(k){ return '<span class="blv" data-on="'+(k===cur?'1':'0')+'">'+labels[k]+'</span>'; }).join(''); }
    bloomPaint('');
    document.getElementById('qgo').onclick=function(){
      var q=norm(document.getElementById('qin').value); var hit='recordar';
      LV.forEach(function(l){ for(var i=0;i<l[1].length;i++){ if(q.indexOf(norm(l[1][i]))>=0){ hit=l[0]; } } });
      bloomPaint(hit);
      var box=document.getElementById('bloom'); box.insertAdjacentHTML('afterend','');
    };
    var STEPS=[];
    function drawSteps(){
      document.getElementById('steps').innerHTML=STEPS.map(function(s,i){ return '<div class="stp"><span class="sn">'+(i+1)+'</span><span class="sx">'+esc(s)+'</span></div>'; }).join('');
      var fe=document.getElementById('feout');
      if(STEPS.length===0){ fe.textContent=''; }
      else if(STEPS.length<3){ fe.innerHTML='Vas por '+STEPS.length+'. Una tarea así suele pedir <b>anticipar un obstáculo</b> (¿y si falta una dirección?).'; }
      else { fe.innerHTML='<b>'+STEPS.length+' pasos.</b> Planificación y memoria de trabajo a la vista. Prueba a reordenarlos si cambia una condición — eso es flexibilidad.'; }
    }
    function addStep(){ var v=document.getElementById('stin').value.trim(); if(!v) return; STEPS.push(v); document.getElementById('stin').value=''; drawSteps(); }
    document.getElementById('stadd').onclick=addStep;
    document.getElementById('stin').addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); addStep(); } });
    wireBack(); drawSteps();
  }

  /* -------- Rol DOCENTE (juicio ciego + equidad + κ aula) -------- */
  function docente(){
    setPiel('docente');
    app.innerHTML='';
    var eq=[
      ['balanza','Juicio ciego','El docente decide la hipótesis <b>antes</b> de ver la sugerencia del sistema.'],
      ['escudo','Sin etiqueta «IA»','La sugerencia nunca se presenta como «la IA dice»: es una opción más a juzgar.'],
      ['grupo','N ≥ 5','Ningún dato individual sale del grupo. Nadie puede ver a un alumno solo.'],
      ['contar','Acceso = derecho','Audio, texto fácil y glosa no se retiran nunca a nadie.'],
      ['mano','Procesamiento = temporal','El andamio se desvanece al demostrar; vuelve sin castigo si el error reaparece.'],
      ['reparar','Restitución sin castigo','Si una competencia recae, el apoyo se restituye — SMC a lo largo de la vida.'],
      ['buscar','Hipótesis de barrera','Se audita el entorno (tarea/criterio) antes que a la persona. Modelo social, no déficit.'],
      ['balanza','κ nunca punitivo','Sin ranking, sin nota, sin comparar personas. κ individual solo lo ve el alumno.']
    ];
    app.appendChild(el('<div>'+
      '<div class="step-tag">Rol docente · panel del nodo de aula</div>'+
      '<h1>El docente decide. A ciegas.</h1>'+
      '<p class="lede">El SAC <b>clasifica, no genera</b>: localiza la barrera y propone andamiaje. Pero el docente juzga <b>primero</b> — y la sugerencia nunca se rotula como «IA».</p>'+
      '<div class="aggk"><div><div class="big">71<small style="font-size:16px">%</small></div><div class="ak-s">κ medio del grupo</div></div>'+
        '<div style="flex:1"><b>Aula 3° B · N = 18</b><div class="ak-s" style="margin-top:4px">+4 pts esta quincena · agregado, nunca individual (N≥5)</div></div></div>'+
      '<div class="blind"><div class="step-tag">Juicio ciego</div>'+
        '<p style="margin:4px 0 2px">Respuesta de un alumno a “¿por qué se erosiona la ladera?”:</p>'+
        '<div class="sr">“Porque llueve y el agua se lleva la tierra. Siempre pasa.”</div>'+
        '<p style="margin:0 0 6px;font-size:14.5px;color:var(--faint)">¿Dónde pondrías la barrera, <b>antes</b> de ver la sugerencia?</p>'+
        '<div class="bh">'+
          '<button class="bhb" data-h="tarea">La <b>tarea</b>: la pregunta no pide causa, pide descripción.</button>'+
          '<button class="bhb" data-h="criterio">El <b>criterio</b>: responde, pero no relaciona causa–efecto (nivel analizar).</button>'+
          '<button class="bhb" data-h="persona">La <b>persona</b>: no conoce el vocabulario (erosión, cobertura).</button>'+
        '</div>'+
        '<div id="revwrap"></div></div>'+
      '<div class="step-tag">8 módulos de equidad</div>'+
      '<div class="equity">'+eq.map(function(e){return '<div class="eq">'+gi(e[0])+'<span><b>'+e[1]+'</b><small>'+e[2]+'</small></span></div>';}).join('')+'</div>'+
      backRow()+
    '</div>'));
    Array.prototype.forEach.call(app.querySelectorAll('.bhb'),function(b){ b.onclick=function(){
      Array.prototype.forEach.call(app.querySelectorAll('.bhb'),function(x){ x.setAttribute('data-sel','0'); });
      b.setAttribute('data-sel','1');
      document.getElementById('revwrap').innerHTML='<div class="reveal">Ya decidiste: <b>'+b.getAttribute('data-h')+'</b>. Recién ahora aparece la sugerencia del sistema — <b>apoyo de procesamiento parcial</b> sobre el salto causa–efecto, con una glosa de «erosión» (apoyo de acceso). Tú decides si la tomas. La constancia registra que juzgaste a ciegas.</div>';
    }; });
    wireBack();
  }

  /* -------- Rol ESTADO / institución -------- */
  function institucion(){
    setPiel('comunidad');
    app.innerHTML='';
    app.appendChild(el('<div>'+
      '<div class="step-tag">Rol Estado / entidad · el mismo κ, agregado</div>'+
      '<h1>El retrato del territorio.</h1>'+
      '<p class="lede">Un mismo motor en tres niveles: individuo → entidad → conocimiento. Arriba del todo, κ se vuelve <b>evidencia para pedir más</b> — construida desde abajo, no recibida de fuera.</p>'+
      nodo('<b>k-anónimo</b>: ningún grupo con N&lt;5 se muestra. Integración con el campus por <b>LTI 1.3</b> que devuelve avance por rúbrica, <b>nunca nombres</b> (NRPS sin datos personales).')+
      '<div class="aggk"><div><div class="big">68<small style="font-size:16px">%</small></div><div class="ak-s">κ de la entidad</div></div>'+
        '<div style="flex:1"><b>6 grupos · N = 112</b><div class="ak-s" style="margin-top:4px">1 grupo oculto por N&lt;5 · agregado k-anónimo</div></div></div>'+
      '<div class="equity">'+
        '<div class="eq">'+gi('subir')+'<span><b>Transferencia y retención, no clics</b><small>La métrica honesta que a los dashboards al uso les falta: ¿se sostiene la competencia en el tiempo?</small></span></div>'+
        '<div class="eq">'+gi('escudo')+'<span><b>Instrumento de medida, no prueba de eficacia</b><small>κ está demostrada solo matemáticamente. La validez causal la aporta el experimento preregistrado (PID).</small></span></div>'+
        '<div class="eq">'+gi('cuenco')+'<span><b>La ofrenda, hacia arriba</b><small>Cada avance se ofrece anónimo. Cuando sois suficientes, el territorio obtiene su propio retrato.</small></span></div>'+
      '</div>'+
      '<div class="btnrow" style="margin-top:14px"><button class="btn ghost sm" id="toTerr2">'+gi('diamante')+' Ver el retrato del territorio</button><button class="btn ghost sm" id="toCuenco2">'+gi('cuenco')+' El cuenco de proyectos</button></div>'+
      backRow()+
    '</div>'));
    var t1=document.getElementById('toTerr2'); if(t1) t1.onclick=function(){ try{ territorio(); }catch(e){} };
    var t2=document.getElementById('toCuenco2'); if(t2) t2.onclick=function(){ try{ cuenco(); }catch(e){} };
    wireBack();
  }



  /* -------- Mapa de lo evaluable (para Ana): la APP desde su cargo + acabado -------- */
  function evaluable(){
    setPiel('alumno');
    app.innerHTML='';
    var items=[
      ['contar','Desde tu cargo','DUA · representación',
        ['¿Hay múltiples formas de presentar lo mismo (texto fácil, glosa, y la base para audio)?','¿El apoyo de acceso reduce barreras de entrada sin simplificar el contenido?','¿El lenguaje es claro y comprensible en contexto mexicano?'],'comprension'],
      ['cambiar','Desde tu cargo','DUA · acción y expresión',
        ['¿Puede el alumno demostrar lo que sabe de más de una manera?','Hueco a decidir: hoy la comprensión se demuestra <b>solo por escrito</b> — ¿debería admitir voz/dictado o elegir?','¿Se evalúa la competencia y no la destreza de teclear?'],'comprension'],
      ['curiosidad','Desde tu cargo','DUA · implicación',
        ['¿La motivación es sana: progreso diegético, sin XP, rachas ni confeti?','¿La entrada circunstancial adapta sin convertirse en termómetro emocional?','¿La autonomía creciente (κ) es el verdadero refuerzo?'],'animo'],
      ['idea','Desde tu cargo','Diseño instruccional',
        ['¿La secuencia leer → comprender → pensar es coherente y se ve en la interfaz?','¿La tarea es auténtica (algo real), no un ejercicio de mentira?','¿La comprensión demostrable está bien llevada a la pantalla (4 operaciones legibles)?'],'comprension'],
      ['mano','Desde tu cargo','Andamiaje visible',
        ['¿Se ve el andamio retirarse paso a paso (fade por criterio, no por tiempo)?','¿La frontera acceso (derecho) / procesamiento (temporal) queda clara en pantalla?','¿La restitución sin castigo se entiende?'],'tasks'],
      ['escudo','Acabado de calidad','Accesibilidad técnica (a11y)',
        ['¿Navegable por teclado, con foco visible en todo lo interactivo?','¿Contraste suficiente, roles/aria, y respeta «reducir movimiento»?','¿Objetivos táctiles ≥44px para manos grandes y pequeñas en tablet compartida?'],''],
      ['mirar','Acabado de calidad','Usabilidad y UX',
        ['¿La navegación es clara y consistente, con baja carga cognitiva?','¿Los errores no culpabilizan (sin rojo para la persona)?','¿Una docente o un alumno se orientan sin manual?'],''],
      ['pantalla','Acabado de calidad','Robustez y acabado',
        ['¿Funciona de verdad offline, en un solo archivo, sin dependencias ni cuenta?','¿Rinde en una tablet modesta (3 GB) sin tirones?','¿El sistema de diseño es coherente (tipografía, color, glifos) y sin bugs — pulido profesional?'],'']
    ];
    var jump={comprension:comprension,capaLeer:capaLeer,cognicion:cognicion,docente:docente,institucion:institucion,tasks:tasks,animo:function(){ animoHome(true); }};
    app.appendChild(el('<div>'+
      '<div class="step-tag">Guía para tu valoración experta</div>'+
      '<h1>Qué evaluar de la aplicación.</h1>'+
      '<p class="lede">Las áreas pensadas <b>desde tu cargo</b> (Tecnología Educativa y DUA) y el <b>acabado de calidad</b> de la app — no la teoría ni la psicometría (eso va con el PID). Cada bloque dice <b>qué mirar</b> y, cuando se puede, te lleva a <b>verlo</b>.</p>'+
      '<div class="nodo">'+gi('pantalla')+'<span>Esta es la vista-guía. La rúbrica para rellenar (◻ sólido / ◻ a matizar / ◻ a corregir + comentario) va aparte, en el documento <b>«Guía de evaluación para Ana»</b>.</span></div>'+
      '<div class="emap">'+items.map(function(it){
        var vb = it[4] ? '<div class="emv"><button class="btn sm" data-go="'+it[4]+'">Verlo →</button></div>' : '';
        return '<div class="em"><div class="emh">'+gi(it[0])+' '+it[2]+'<span class="tag">'+it[1]+'</span></div>'+
          '<ul>'+it[3].map(function(b){return '<li>'+b+'</li>';}).join('')+'</ul>'+vb+'</div>';
      }).join('')+'</div>'+
      '<div class="note">Marco desde tu especialidad: <b>DUA (CAST)</b> — los 3 principios: representación, acción/expresión, implicación. El acabado se juzga como producto de tecnología educativa: accesible, usable y robusto en el aula real.</div>'+
      '<div class="btnrow" style="margin-top:18px"><button class="btn ghost sm" id="bkana">← Recorrido</button><button class="btn ghost sm" id="bkhome">Inicio</button></div>'+
    '</div>'));
    Array.prototype.forEach.call(app.querySelectorAll('[data-go]'),function(b){ b.onclick=function(){ var f=jump[b.getAttribute('data-go')]; if(f) f(); }; });
    var a=document.getElementById('bkana'); if(a) a.onclick=recorridoAna;
    var h=document.getElementById('bkhome'); if(h) h.onclick=home;
  }

  home();
})();

</script>

<button class="lf-btn" id="lfBtn" type="button" aria-pressed="false" aria-label="Activar o desactivar el modo de lectura fácil para dislexia"><span class="b">Aa</span> Lectura fácil</button>
<script>
  (function(){
    var K="emma-lectura", el=document.documentElement, b=document.getElementById("lfBtn");
    function set(on){
      el.setAttribute("data-lectura", on?"facil":"normal");
      b.setAttribute("aria-pressed", on?"true":"false");
      b.lastChild.textContent = on ? " Lectura fácil ✓" : " Lectura fácil";
      try{ localStorage.setItem(K, on?"1":"0"); }catch(e){}
    }
    var saved="0"; try{ saved=localStorage.getItem(K)||"0"; }catch(e){}
    set(saved==="1");
    b.addEventListener("click", function(){ set(el.getAttribute("data-lectura")!=="facil"); });
  })();
</script>
